name: Windows VLESS Proxy (bore)
on: workflow_dispatch

jobs:
  proxy:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Download Xray & Bore
        shell: powershell
        run: |
          # Xray indir
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "." -Force

          # Bore indir
          Invoke-WebRequest -Uri "https://github.com/ekzhang/bore/releases/latest/download/bore-v0.5.0-x86_64-pc-windows-msvc.zip" -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath "." -Force

      - name: Write Xray Config
        shell: powershell
        run: |
          $config = @'
          {
            "log": { "loglevel": "warning" },
            "inbounds": [{
              "port": 8080,
              "protocol": "vless",
              "settings": {
                "clients": [{ "id": "66666666-6666-6666-6666-666666666666" }],
                "decryption": "none"
              },
              "streamSettings": {
                "network": "tcp"
              }
            }],
            "outbounds": [{ "protocol": "freedom" }]
          }
          '@
          $config | Out-File -FilePath "config.json" -Encoding utf8

      - name: Start Xray & Bore Tunnel
        shell: powershell
        run: |
          # Xray başlat
          Start-Process -FilePath ".\xray.exe" -ArgumentList "run -c config.json" -NoNewWindow

          Start-Sleep -Seconds 3

          # Bore başlat (arkaplanda)
          Start-Process -FilePath ".\bore.exe" -ArgumentList "local 8080 --to bore.pub" -RedirectStandardOutput "bore.log" -RedirectStandardError "bore-err.log" -NoNewWindow

          Start-Sleep -Seconds 5

          # Port numarasını al
          $log = Get-Content "bore.log" -ErrorAction SilentlyContinue
          $err = Get-Content "bore-err.log" -ErrorAction SilentlyContinue
          $allLog = ($log + $err) -join "`n"
          
          $match = [regex]::Match($allLog, "listening at bore\.pub:(\d+)")
          $port = $match.Groups[1].Value

          Write-Host ""
          Write-Host "================================================================"
          Write-Host "NEKORAY ICIN VLESS LINKI (TCP - TLS YOK):"
          Write-Host "================================================================"
          Write-Host "vless://66666666-6666-6666-6666-666666666666@bore.pub:$port?encryption=none&security=none&type=tcp#GitHub_bore"
          Write-Host "================================================================"

          while ($true) { Start-Sleep -Seconds 60 }
