name: GitHub Proxy (Final Kesin Cozum)
on: workflow_dispatch

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 9999

    steps:
      - name: Install Cloudflared & Gost
        run: |
          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gunzip gost-linux-amd64-2.11.5.gz
          mv gost-linux-amd64-2.11.5 gost
          chmod +x gost
          wget -q https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-linux-amd64 -O cloudflared
          chmod +x cloudflared

      - name: Start VLESS & CF Tunnel
        run: |
          # VLESS sunucusu başlat (ID: 66666666-6666-6666-6666-666666666666)
          ./gost -L=vless://66666666-6666-6666-6666-666666666666@:8080?path=/ws > gost.log 2>&1 &
          
          # Cloudflare Tunnel başlat
          ./cloudflared tunnel --url http://localhost:8080 > cf.log 2>&1 &
          
          sleep 10
          CF_URL=$(grep -oE 'https://[a-zA-Z0-9.-]+\.trycloudflare\.com' cf.log | head -n 1 | sed 's/https:\/\///')

          echo ""
          echo "================================================================"
          echo "🌐 NEKOBOX ICIN LINKIN (ASAGIDAKINI TAMAMEN KOPYALA):"
          echo "================================================================"
          echo "vless://66666666-6666-6666-6666-666666666666@$CF_URL:443?encryption=none&security=tls&sni=$CF_URL&type=ws&path=%2Fws#GitHub_VLESS"
          echo "================================================================"
          
          tail -f cf.log
