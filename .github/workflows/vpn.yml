name: GitHub Proxy VPN (Shadowsocks)
on: workflow_dispatch

jobs:
  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 9999

    steps:
      - name: Install Gost & Bore
        run: |
          wget -q https://github.com/ginuerzh/gost/releases/download/v2.11.5/gost-linux-amd64-2.11.5.gz
          gunzip gost-linux-amd64-2.11.5.gz
          mv gost-linux-amd64-2.11.5 gost
          chmod +x gost

          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore

      - name: Start Shadowsocks Proxy and Tunnel
        run: |
          # Shadowsocks protokolü başlat (Şifre: admin123, Metot: aes-256-gcm)
          ./gost -L=ss://aes-256-gcm:admin123@:8080 > gost.log 2>&1 &
          
          # Tüneli başlat
          ./bore local 8080 --to bore.pub > bore.log 2>&1 &
          
          sleep 5
          PORT=$(grep -oP 'remote_port=\K\d+' bore.log | head -1)

          echo ""
          echo "================================================================"
          echo "🌐 NEKORAY / NEKOBOX İÇİN BAĞLANTI BİLGİSİ"
          echo "================================================================"
          echo "ss://YWVzLTI1Ni1nY206YWRtaW4xMjM@bore.pub:$PORT"
          echo "================================================================"
          
          tail -f bore.log
