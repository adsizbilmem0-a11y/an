name: Windows VLESS Proxy (bore)
on: workflow_dispatch

jobs:
  proxy:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Download Xray & Bore
        shell: powershell
        run: |
          Invoke-WebRequest -Uri "https://github.com/XTLS/Xray-core/releases/latest/download/Xray-windows-64.zip" -OutFile "xray.zip"
          Expand-Archive -Path "xray.zip" -DestinationPath "." -Force

          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*x86_64*windows*" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath "." -Force

      - name: Write Xray Config
        shell: cmd
        run: |
          echo {"log":{"loglevel":"warning"},"inbounds":[{"port":8080,"protocol":"vless","settings":{"clients":[{"id":"66666666-6666-6666-6666-666666666666"}],"decryption":"none"},"streamSettings":{"network":"tcp"}}],"outbounds":[{"protocol":"freedom"}]} > config.json

      - name: Start Xray & Bore Tunnel
        shell: powershell
        run: |
          # Config kontrol
          $raw = [System.IO.File]::ReadAllBytes("config.json")
          Write-Host "İlk 3 byte: $($raw[0]) $($raw[1]) $($raw[2])"
          
          Start-Process -FilePath ".\xray.exe" -ArgumentList "run -c config.json" -NoNewWindow
          Start-Sleep -Seconds 3

          Start-Process -FilePath ".\bore.exe" -ArgumentList "local 8080 --to bore.pub" -RedirectStandardOutput "bore.log" -RedirectStandardError "bore-err.log" -NoNewWindow
          Start-Sleep -Seconds 8

          $allLog = @()
          $allLog += Get-Content "bore.log" -ErrorAction SilentlyContinue
          $allLog += Get-Content "bore-err.log" -ErrorAction SilentlyContinue
          $logText = $allLog -join "`n"
          Write-Host $logText

          $match = [regex]::Match($logText, "remote_port=(\d+)")
          $port = $match.Groups[1].Value

          Write-Host ""
          Write-Host "================================================================"
          Write-Host "NEKORAY LINKI:"
          Write-Host "vless://66666666-6666-6666-6666-666666666666@bore.pub:$port?encryption=none&security=none&type=tcp#GitHub_bore"
          Write-Host "================================================================"

          while ($true) { Start-Sleep -Seconds 60 }
