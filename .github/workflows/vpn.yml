name: Windows SOCKS5 Proxy
on: workflow_dispatch

jobs:
  proxy:
    runs-on: windows-latest
    timeout-minutes: 350

    steps:
      - name: Download Bore
        shell: powershell
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/ekzhang/bore/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*x86_64*windows*" }
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "bore.zip"
          Expand-Archive -Path "bore.zip" -DestinationPath "." -Force

      - name: Start SSH SOCKS5 & Bore
        shell: powershell
        run: |
          # Windows'ta OpenSSH built-in geliyor, SOCKS5 açıyoruz
          # Kendine SSH at, -D ile SOCKS5 proxy aç
          $sshCmd = 'ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=NUL -N -D 0.0.0.0:1080 localhost'
          
          # Daha basiti: Python ile SOCKS5 (Python da built-in geliyor runner'da)
          $pyScript = @'
import socket, threading, select

def handle(client):
    try:
        data = client.recv(262)
        client.send(b'\x05\x00')
        data = client.recv(262)
        addr_type = data[3]
        if addr_type == 1:
            addr = socket.inet_ntoa(data[4:8])
            port = int.from_bytes(data[8:10], 'big')
        elif addr_type == 3:
            l = data[4]
            addr = data[5:5+l].decode()
            port = int.from_bytes(data[5+l:7+l], 'big')
        else:
            client.close(); return
        remote = socket.socket()
        remote.connect((addr, port))
        client.send(b'\x05\x00\x00\x01' + socket.inet_aton('0.0.0.0') + (0).to_bytes(2,'big'))
        def fwd(a, b):
            while True:
                r, _, _ = select.select([a], [], [], 60)
                if not r: break
                d = a.recv(4096)
                if not d: break
                b.sendall(d)
        threading.Thread(target=fwd, args=(client, remote), daemon=True).start()
        threading.Thread(target=fwd, args=(remote, client), daemon=True).start()
    except: client.close()

s = socket.socket()
s.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
s.bind(('0.0.0.0', 1080))
s.listen(100)
print('SOCKS5 ready on 1080', flush=True)
while True:
    c, _ = s.accept()
    threading.Thread(target=handle, args=(c,), daemon=True).start()
'@
          $pyScript | Out-File -FilePath "socks5.py" -Encoding ascii

          # Python başlat
          Start-Process -FilePath "python" -ArgumentList "socks5.py" -NoNewWindow
          Start-Sleep -Seconds 3

          # Bore başlat
          Start-Process -FilePath ".\bore.exe" -ArgumentList "local 1080 --to bore.pub" -RedirectStandardError "bore.log" -NoNewWindow
          Start-Sleep -Seconds 8

          $log = Get-Content "bore.log" -ErrorAction SilentlyContinue
          $log | ForEach-Object { Write-Host $_ }
          $match = [regex]::Match(($log -join "`n"), "remote_port=(\d+)")
          $port = $match.Groups[1].Value

          Write-Host ""
          Write-Host "========================================"
          Write-Host "SOCKS5 PROXY:"
          Write-Host "Host : bore.pub"
          Write-Host "Port : $port"
          Write-Host "Tip  : SOCKS5"
          Write-Host "========================================"

          while ($true) { Start-Sleep -Seconds 60 }
