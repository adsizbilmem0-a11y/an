name: Lindsadasd
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 9999
    steps:
      - name: Setup SSH
        run: |
          echo "runner:Admin123!" | sudo chpasswd
          sudo systemctl start ssh

      - name: Start Bore Tunnel
        run: |
          wget -q https://github.com/ekzhang/bore/releases/download/v0.5.1/bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          tar -xf bore-v0.5.1-x86_64-unknown-linux-musl.tar.gz
          chmod +x bore

          ./bore local 22 --to bore.pub 2>&1 | tee bore.log &
          sleep 8

          PORT=$(grep -oP 'remote_port=\K[0-9]+' bore.log | head -1)

          echo ""
          echo "========================================================"
          echo "CMD'ye yapistir:"
          echo "ssh -D 1080 -N -o StrictHostKeyChecking=no runner@bore.pub -p $PORT"
          echo "Sifre: Admin123!"
          echo "========================================================"

          tail -f bore.log
