name: Linux SSH
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 9999
    steps:
      - name: Setup SSH
        run: |
          echo "runner:Admin123!" | sudo chpasswd
          sudo systemctl start ssh

      - name: Start Ngrok Tunnel
        run: |
          curl -sSL https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-linux-amd64.tgz | tar xz
          chmod +x ngrok

          ./ngrok tcp 22 --authtoken NGROK_TOKEN_BURAYA &
          sleep 5

          TUNNEL=$(curl -s http://localhost:4040/api/tunnels | grep -oP '"public_url":"\K[^"]+' | head -1)
          HOST=$(echo $TUNNEL | sed 's/tcp:\/\///' | cut -d: -f1)
          PORT=$(echo $TUNNEL | sed 's/tcp:\/\///' | cut -d: -f2)

          echo ""
          echo "========================================================"
          echo "CMD'ye yapistir:"
          echo "ssh -D 1080 -N -o StrictHostKeyChecking=no runner@$HOST -p $PORT"
          echo "Sifre: Admin123!"
          echo "========================================================"

          tail -f /dev/null
